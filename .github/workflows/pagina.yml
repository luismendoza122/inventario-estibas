# Publica el Inventario de estibas en GitHub Pages: https://luismendoza122.github.io/inventario-estibas/
# Es la página que abren el administrador y los enlaces de los operadores que se mandan por WhatsApp.
name: Publicar página

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pagina
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Revisar que el JavaScript no tenga errores
        run: |
          for f in www/*.js nube/funcion.js; do node --check "$f"; done
          test -f www/index.html && test -f www/contar.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: despliegue
        uses: actions/deploy-pages@v4
