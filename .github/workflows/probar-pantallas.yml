# Prueba las pantallas publicadas en Chrome (Playwright) contra la nube real.
# Se corre a mano con un código de administrador de PRUEBA (temporal); al final borra lo que creó.
name: Probar pantallas
on:
  workflow_dispatch:
    inputs:
      codigo:
        description: Código de administrador de PRUEBA (temporal)
        required: true
permissions:
  contents: read
jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar Playwright con Chrome
        run: |
          pip install playwright==1.48.0
          python -m playwright install --with-deps chromium
      - name: Probar en la página publicada
        env:
          CODIGO: ${{ inputs.codigo }}
          PAGINA: https://luismendoza122.github.io/inventario-estibas/
        run: |
          echo "::add-mask::$CODIGO"
          python scripts/probar_inventario_ui.py
